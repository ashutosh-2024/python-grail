<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Browse &mdash; python-grail</title>
<meta name="description" content="Browse every python-grail entry by difficulty, topic or keyword.">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Archivo:wght@400;500;600;700;800;900&family=JetBrains+Mono:wght@400;500;600;700&display=swap" rel="stylesheet">
<script src="assets/js/theme.js?v=b51efe16"></script>
<link rel="stylesheet" href="assets/css/style.css?v=8a270932">
</head>
<body>

<header class="site-header">
  <div class="wrap">
    <a class="brand" href="index.html">
      <span class="snake">&#128013;</span>
      <span>python<span class="accent">-grail</span></span>
    </a>
    <nav class="nav">
      <a href="browse.html" class="active">Browse</a>
      <a class="gh" data-repo-link href="#" target="_blank" rel="noopener">GitHub</a>
    </nav>
  </div>
</header>

<main>
  <div class="wrap">
    <div class="entry-head">
      <h1>Browse</h1>
      <p class="subtitle">every entry, filterable</p>
    </div>

    <div class="entry-body">
      <div class="filters">
        <div class="filter-group search-box">
          <label for="q">Search</label>
          <input type="search" id="q" placeholder="title, topic, or anything in the code&hellip;" autocomplete="off">
        </div>
        <div class="filter-group">
          <label for="tag-select">Topic</label>
          <select id="tag-select"></select>
        </div>
      </div>

      <div class="filters">
        <div class="filter-group">
          <label>Difficulty</label>
          <div class="chips" id="difficulty-chips"></div>
        </div>
        <div class="filter-group">
          <label>&nbsp;</label>
          <button class="chip" type="button" id="reset">Reset</button>
        </div>
      </div>

      <p class="result-count" id="count"></p>
      <div class="entry-list" id="list"></div>
    </div>
  </div>
</main>

<footer class="site-footer">
  <div class="wrap">
    <p class="note">Every snippet was executed before it was written up. The outputs are captured from those runs.</p>
    <p>Built and verified on CPython <span data-python></span> &middot;
       <span data-count></span> entries &middot;
       &copy; <span data-year></span> &middot;
       <a data-repo-link href="#" target="_blank" rel="noopener">source on GitHub</a></p>
  </div>
</footer>
